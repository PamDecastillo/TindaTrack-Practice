<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Logbook - TindaTrack Inventory</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header Section -->
    <header class="top-header">
        <img src="logo.png" alt="TindaTrack Logo" class="logo">
        <div class="date-container">
            <div class="date-text" id="header-date">
                <!-- Date is populated by JavaScript -->
            </div>
            <img src="calendar.png" alt="Calendar Icon" class="calendar-icon">
        </div>
    </header>

    <!-- Navigation Section (links marked data-admin are hidden from Staff by JavaScript) -->
    <nav class="main-nav">
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="products.html" data-admin>Product List</a></li>
            <li><a href="stock.html">Update Inventory</a></li>
            <li><a href="reports.html" data-admin>Online Logbook</a></li>
        </ul>
        <a href="#" id="sign-out">Sign Out</a>
    </nav>

    <!-- Main Content Area -->
    <main class="dashboard-container">

        <section class="panel main-section">
            <h2>Online Logbook</h2>

            <div class="kpi-grid">
                <div class="kpi-card">Total Stock In <span id="kpi-total-in">0</span></div>
                <div class="kpi-card">Total Stock Out <span id="kpi-total-out">0</span></div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>SKU</th>
                        <th>Product</th>
                        <th>Type</th>
                        <th>Qty</th>
                        <th>Handled by</th>
                        <th>Remarks</th>
                    </tr>
                </thead>
                <tbody id="logbook-body">
                    <!-- Rendered dynamically -->
                </tbody>
            </table>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 TindaTrack Inc. | Track Smart Sell Better</p>
    </footer>

    <!-- Link to JavaScript file -->
    <script src="js/app.js"></script>
    
</body>
</html>
