<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog - TindaTrack Inventory</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header Section -->
    <header class="top-header">
        <img src="logo.png" alt="TindaTrack Logo" class="logo">
        <div class="date-container">
            <div class="date-text" id="header-date">
                <!-- Date is populated by JavaScript -->
            </div>
            <img src="calendar.png" alt="Calendar Icon" class="calendar-icon">
        </div>
    </header>

    <!-- Navigation Section (links marked data-admin are hidden from Staff by JavaScript) -->
    <nav class="main-nav">
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="products.html" data-admin>Product List</a></li>
            <li><a href="stock.html">Update Inventory</a></li>
            <li><a href="reports.html" data-admin>Online Logbook</a></li>
        </ul>
        <a href="#" id="sign-out">Sign Out</a>
    </nav>

    <!-- Main Content Area -->
    <main class="dashboard-container">

        <!-- Product Registry Table -->
        <section class="panel main-section">
            <h2>Product Master Registry</h2>
            <table>
                <thead>
                    <tr>
                        <th>SKU</th>
                        <th>Item Designation</th>
                        <th>Category</th>
                        <th>Unit Price (₱)</th>
                        <th>Stock Level</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="product-catalog-body">
                    <!-- Rendered dynamically -->
                </tbody>
            </table>
        </section>

        <!-- Add Product Form -->
        <aside class="panel side-section">
            <h3>Add New Product</h3>
            <form id="add-product-form">
                <div class="form-group">
                    <label for="prod-sku">SKU Code</label>
                    <input type="text" id="prod-sku" required placeholder="e.g. SKU-104">
                </div>
                <div class="form-group">
                    <label for="prod-name">Product Name</label>
                    <input type="text" id="prod-name" required placeholder="Product Title">
                </div>
                <div class="form-group">
                    <label for="prod-cat">Category</label>
                    <input type="text" id="prod-cat" required placeholder="e.g. Hardware">
                </div>
                <div class="form-group">
                    <label for="prod-price">Unit Price (₱)</label>
                    <input type="number" step="0.01" min="0.01" id="prod-price" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="prod-stock">Initial Quantity</label>
                    <input type="number" min="0" step="1" id="prod-stock" required placeholder="0">
                </div>
                <div class="form-group">
                    <label for="prod-min">Low Stock Threshold</label>
                    <input type="number" min="0" step="1" id="prod-min" required placeholder="5">
                </div>
                <button type="submit">Register Product</button>
            </form>
        </aside>

    </main>

    <footer>
        <p>&copy; 2026 TindaTrack Inc. | Track Smart Sell Better</p>
    </footer>

    <!-- Link to JavaScript file -->
    <script src="js/app.js"></script>
    
</body>
</html>
