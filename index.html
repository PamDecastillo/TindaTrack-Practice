<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TindaTrack Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">

    <!-- Header Section -->
    <header class="main-header">
        <div class="logo-wrapper">
            <img src="logo.png" alt="TindaTrack Logo" class="logo">
        </div>
        <p class="tagline">Hirap mag-track ng paninda?</p>
    </header>

    <!-- Main Content Area (Store Background) -->
    <main class="store-background">

        <!-- Login Form Overlay -->
        <div class="login-overlay-box">
            <form class="login-form" id="login-form">
                <h2>Log-In</h2>

                <div id="auth-error" role="alert"></div>

                <div class="input-group">
                    <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required>
                </div>

                <div class="input-group">
                    <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
                </div>

                <a href="#" class="forgot-password-link">Forgot Password?</a>

                <button type="submit" class="login-submit-button" aria-label="Log in">&#10141;</button>
            </form>
        </div>

    </main>

    <!-- Link to JavaScript file -->
    <script src="js/app.js"></script>
    
</body>
</html>
